services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Ejecuta scripts/Start-Docker.ps1 o configura .env}
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd
          -S localhost -U sa -C -b -Q "SELECT 1" -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    entrypoint: ["/bin/bash", "/init/init-db.sh"]
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Ejecuta scripts/Start-Docker.ps1 o configura .env}
    volumes:
      - ./database:/init:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Clave: ${JWT_SECRET:?Ejecuta scripts/Start-Docker.ps1 o configura .env}
      ConnectionStrings__Veterinaria: "Server=db;Database=VeterinariaS14DB;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Ejecuta scripts/Start-Docker.ps1 o configura .env};Encrypt=True;TrustServerCertificate=True"
    ports:
      - "127.0.0.1:${API_PORT:-5164}:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  sql-data:
